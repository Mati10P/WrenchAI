name: wrenchai
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wrenchai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wrenchai_local}
      POSTGRES_DB: ${POSTGRES_DB:-wrenchai}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      MANUAL_LIBRARY_PATH: ${MANUAL_LIBRARY_PATH:-}
      MANUAL_FIGURES_PATH: ${MANUAL_FIGURES_PATH:-}
      MANUAL_SECTIONS_PATH: ${MANUAL_SECTIONS_PATH:-}
      HYBRID_RETRIEVAL: ${HYBRID_RETRIEVAL:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      VISUAL_EVIDENCE_REVIEW: ${VISUAL_EVIDENCE_REVIEW:-true}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wrenchai}:${POSTGRES_PASSWORD:-wrenchai_local}@db:5432/${POSTGRES_DB:-wrenchai}
    volumes:
      - ./data/private/manuals/library-v1:/manual-library:ro
      - ${MANUAL_FIGURES_DIRECTORY:-./data/private/manuals/figures-v1}:/manual-figures:ro
      - ${MANUAL_SECTIONS_DIRECTORY:-./data/private/manuals/sections-v1}:/manual-sections:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
volumes:
  postgres_data:
