name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: wrenchai
          POSTGRES_PASSWORD: wrenchai_ci
          POSTGRES_DB: wrenchai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wrenchai -d wrenchai"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://wrenchai:wrenchai_ci@127.0.0.1:5432/wrenchai
      GEMINI_API_KEY: ""
      MANUAL_LIBRARY_PATH: ""
      MANUAL_FIGURES_PATH: ""
      MANUAL_SECTIONS_PATH: ""
      HYBRID_RETRIEVAL: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt -r scripts/requirements-layout.txt
      - name: PostgreSQL integration and public scenario boundaries
        working-directory: backend
        run: python -m pytest -q --tb=short
      - name: Public document preparation tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Check commit whitespace
        run: git show --format= --check HEAD

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run format:check
      - run: npm run build
